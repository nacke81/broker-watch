<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Watch</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5f6b7a; --line:#e2e6eb;
          --red:#c62828; --amber:#b26a00; --green:#2e7d32; --blue:#1d5fbf; --purple:#6a3fb5; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:14px 16px 0; position:sticky; top:0; z-index:2; }
  header h1 { margin:0 0 2px; font-size:20px; }
  header .sub { font-size:13px; color:#c9d1db; }
  header .sub a { color:#fff; }
  nav[hidden] { display:none; }
  .banner { background:#fff3cd; color:#5c4400; font-size:13px; padding:6px 16px; }
  nav { display:flex; gap:4px; margin-top:10px; }
  nav button { flex:1; background:none; border:0; color:#c9d1db; padding:10px 4px; font-size:15px; border-bottom:3px solid transparent; cursor:pointer; }
  nav button[aria-selected=true] { color:#fff; border-bottom-color:#fff; font-weight:600; }
  main { max-width:720px; margin:0 auto; padding:12px; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 8px; text-align:center; }
  .tile b { display:block; font-size:24px; }
  .tile span { font-size:12px; color:var(--muted); }
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit; }
  .row .name { font-weight:600; }
  .row .meta { font-size:13px; color:var(--muted); }
  .row .grow { flex:1; min-width:0; }
  .pill { font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .s-found, .s-came-back { background:#fde7e7; color:var(--red); }
  .s-couldnt { background:#fff1d6; color:var(--amber); }
  .s-requested { background:#e5eefc; color:var(--blue); }
  .s-gone, .s-not-found { background:#e6f4e7; color:var(--green); }
  .s-never { background:#eee; color:var(--muted); }
  h2 { font-size:15px; color:var(--muted); margin:18px 4px 8px; text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; }
  .back { background:none; border:0; color:var(--blue); font-size:15px; padding:6px 0; cursor:pointer; }
  .btn { display:inline-block; background:var(--blue); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:15px; text-decoration:none; cursor:pointer; }
  .btn.ghost { background:none; color:var(--blue); border:1px solid var(--blue); }
  .hist { display:flex; gap:4px; margin:8px 0 2px; }
  .hist i { flex:1; height:22px; border-radius:4px; }
  .hist .found { background:var(--red); } .hist .not_found { background:var(--green); } .hist .couldnt_check { background:var(--amber); }
  .legend { font-size:12px; color:var(--muted); }
  ol.ladder { padding-left:22px; margin:6px 0; }
  ol.ladder li { margin:3px 0; color:var(--muted); }
  ol.ladder li.worked { color:var(--green); font-weight:600; }
  ol.ladder li.failed { color:var(--muted); text-decoration:line-through; }
  ol.ladder li.next { color:var(--amber); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th.n, td.n { text-align:right; font-variant-numeric:tabular-nums; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; font:inherit; padding:9px; border:1px solid var(--line); border-radius:8px; }
  .items { list-style:none; margin:0 0 6px; padding:0; }
  .items li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .items li.note { border:0; }
  .x { background:none; border:0; color:var(--red); font-size:13px; cursor:pointer; padding:4px 0 4px 8px; }
  .add { display:flex; gap:8px; }
  .add input { flex:1; min-width:0; }
  .add .btn { white-space:nowrap; }
  .err { color:var(--red); font-size:13px; min-height:18px; margin-top:6px; }
  .ok { color:var(--green); font-size:13px; min-height:18px; margin-top:6px; }
  .note { font-size:13px; color:var(--muted); }
  @media (max-width:420px) { .tile b { font-size:20px; } }
</style>
</head>
<body>
<header>
  <h1>Broker Watch</h1>
  <div class="sub" id="lastRun"></div>
  <div class="sub" id="me"></div>
  <nav role="tablist" hidden>
    <button role="tab" data-tab="sites" aria-selected="true">Sites</button>
    <button role="tab" data-tab="runs" aria-selected="false">Runs</button>
    <button role="tab" data-tab="me" aria-selected="false">My details</button>
  </nav>
</header>
<main id="app"></main>
<script src="vendor/supabase-2.117.3.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
